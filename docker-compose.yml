version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: paymesh_postgres
    restart: always
    environment:
      POSTGRES_USER: paymesh_user
      POSTGRES_PASSWORD: paymesh_password
      POSTGRES_DB: paymesh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymesh_user -d paymesh_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
